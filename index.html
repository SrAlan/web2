<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardinal aleatorio</title>
<style>
  :root { --bg:#14161a; --card:#1e2127; --txt:#e8e8e8; --dim:#9aa0a8; --acc:#d63a3a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--txt); font-family:system-ui, Segoe UI, sans-serif; padding:16px; }
  .card { background:var(--card); border-radius:16px; padding:32px 24px; width:100%; max-width:400px;
          text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  h1 { margin:0 0 24px; font-size:1.3rem; color:var(--dim); font-weight:500; }
  .count { font-size:5rem; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .count-label { color:var(--dim); margin:8px 0 28px; }
  .playing .count { color:var(--acc); }
  .cardinal { width:100%; padding:18px; font-size:1.3rem; font-weight:700; border:none; border-radius:12px;
              background:var(--acc); color:#fff; cursor:pointer; transition:transform .1s; }
  .cardinal:active { transform:scale(.97); }
  .next { margin-top:20px; color:var(--dim); font-size:.9rem; }
</style>
</head>
<body>
<div class="card" id="card">
  <h1>🐦 Cardinal</h1>
  <div class="count" id="count">0</div>
  <div class="count-label">cardinales</div>
  <button class="cardinal" id="cardinal">🐦 Cardinal</button>
  <div class="next" id="next"></div>
</div>

<audio id="audio" src="cardinal.mp4" preload="auto"></audio>

<script>
  // Intervalo aleatorio fijo (punto medio): entre 1 y 5 minutos
  const MIN_SEC = 60;
  const MAX_SEC = 300;

  const $ = id => document.getElementById(id);
  const audio = $('audio');
  audio.volume = 1;

  let count = 0;
  try { count = Number(localStorage.getItem('cardinal-count')) || 0; } catch {}
  $('count').textContent = count;

  let nextAt = 0;
  let pending = false; // el navegador bloqueó el sonido hasta que haya un clic

  function fmt(sec) {
    sec = Math.max(0, Math.ceil(sec));
    return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
  }

  function play() {
    audio.volume = 1;
    audio.currentTime = 0;
    audio.play().then(() => {
      pending = false;
      count++;
      $('count').textContent = count;
      try { localStorage.setItem('cardinal-count', count); } catch {}
    }).catch(() => { pending = true; });
  }

  function schedule() {
    nextAt = Date.now() + (MIN_SEC + Math.random() * (MAX_SEC - MIN_SEC)) * 1000;
  }

  // Revisión por reloj: resiste mejor la limitación de temporizadores en pestañas de fondo
  setInterval(() => {
    if (Date.now() >= nextAt) { play(); schedule(); }
    $('next').textContent = pending
      ? 'Haz clic en cualquier parte para activar el sonido'
      : `Próximo canto en ${fmt((nextAt - Date.now()) / 1000)}`;
  }, 500);

  // Si el navegador bloqueó un canto automático, suena en cuanto haya un clic
  document.addEventListener('pointerdown', e => {
    if (pending && e.target.id !== 'cardinal') play();
  });

  $('cardinal').addEventListener('click', play);

  audio.addEventListener('play', () => $('card').classList.add('playing'));
  audio.addEventListener('ended', () => $('card').classList.remove('playing'));

  schedule();
</script>
</body>
</html>
